name: Publish GuildFlow to CurseForge

# IMPORTANT: Publish ONLY the exact GuildFlow.zip from a GitHub Release
# in this PUBLIC repository. Changes to derjp87/GuildFlow/develop do not trigger this.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing GuildFlow-Releases tag (e.g. v0.18.7). Do not rerun for a version already uploaded to CurseForge."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: curseforge-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_PROJECT_ID: "1742845"
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check out release repository tools (not the private addon sources)
        uses: actions/checkout@v4

      - name: Fetch the exact published ZIP, checksums, and release notes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .curseforge
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,body > .curseforge/release.json

          # A release.published event may reach Actions before all assets are visible.
          for attempt in {1..12}; do
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern GuildFlow.zip --pattern SHA256SUMS \
              --dir .curseforge --clobber || true
            if [[ -s .curseforge/GuildFlow.zip && -s .curseforge/SHA256SUMS ]]; then
              break
            fi
            if (( attempt == 12 )); then
              echo "::error::GuildFlow.zip or SHA256SUMS is missing from GitHub Release $RELEASE_TAG"
              exit 1
            fi
            sleep 10
          done

      - name: Validate ZIP contents, checksum and Forever version
        run: python3 tools/prepare_curseforge_upload.py

      - name: Upload the SAME ZIP to CurseForge project 1742845
        if: env.CF_API_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "X-Api-Token: $CF_API_TOKEN" \
            --form-string "metadata=$(cat .curseforge/metadata.json)" \
            --form "file=@.curseforge/GuildFlow.zip;type=application/zip" \
            "https://wow.curseforge.com/api/projects/$CF_PROJECT_ID/upload-file" \
            > .curseforge/response.json
          python3 - <<'PY'
          import json
          with open(".curseforge/response.json", encoding="utf-8") as f:
              response = json.load(f)
          if not isinstance(response, dict) or not response.get("id"):
              raise SystemExit("CurseForge upload returned no file ID")
          print(f"CurseForge accepted file ID {response['id']} for moderation.")
          PY

      - name: Explain missing API token
        if: env.CF_API_TOKEN == ''
        run: |
          echo "::notice::The ZIP validation succeeded, but no upload was attempted."
          echo "::notice::Set the CF_API_TOKEN secret under GuildFlow-Releases -> Settings -> Secrets and variables -> Actions."
